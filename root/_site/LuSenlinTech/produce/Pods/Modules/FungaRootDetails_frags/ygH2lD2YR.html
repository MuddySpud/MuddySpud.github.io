<h4 id="truffle-inoculated-root-vegetables">Truffle-Inoculated Root Vegetables</h4>

<p>This module uses a selection of compact roots - Finger Carrot, Baby Beet, Tokyo Turnip, and Baby Kohlrabi - that have been pre-colonised (inoculated) with truffle-forming mycorrhizal fungi before being installed in the FungaRoot unit.</p>
