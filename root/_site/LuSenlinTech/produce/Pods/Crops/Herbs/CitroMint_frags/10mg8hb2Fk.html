<p>This charming dwarf cultivar is a burst of pure, sunlit citrus in mint form. Citro-Mint masterfully blends the familiar, cheerful aroma of lemon with the soft, refreshing undertones of classic spearmint, creating a uniquely bright and uplifting herb that is as productive as it is compact.</p>
