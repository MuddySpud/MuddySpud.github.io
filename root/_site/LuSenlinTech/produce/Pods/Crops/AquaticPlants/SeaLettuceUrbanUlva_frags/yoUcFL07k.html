<p>This bright green, sheet-forming macroalgae is the ocean’s answer to a delicate lettuce. ‘Urban Ulva’ offers a surprisingly mild, salty-sweet flavour and a soft, silky texture, making it one of the most approachable and versatile sea vegetables for the home chef.</p>
