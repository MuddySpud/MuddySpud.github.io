<p>This is the classic nori of sushi fame, cultivated in a compact, tender-leaved form perfect for home harvest. ‘Sachi-Nori’ delivers the deep, briny-sweet umami that is the very soul of the ocean, providing the foundational flavour for a multitude of Japanese and modern dishes.</p>
