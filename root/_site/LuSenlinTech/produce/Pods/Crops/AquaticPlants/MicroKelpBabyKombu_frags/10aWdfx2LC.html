<p>This is a dwarf cultivar of the legendary kombu seaweed, the cornerstone of Japanese dashi broth. ‘Baby Kombu’ condenses the profound, oceanic umami of its wild ancestors into a tender, fast-growing form, delivering the very essence of the sea to your urban kitchen.</p>
